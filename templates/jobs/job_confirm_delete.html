{% extends "base.html" %}
{% block title %}Delete Job - Job Portal{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-danger text-white d-flex align-items-center">
                    <i class="fas fa-trash me-2"></i>
                    <h2 class="card-title mb-0">Delete Job</h2>
                </div>
                <div class="card-body">
                    <p class="card-text"><i class="fas fa-exclamation-triangle me-2"></i>Are you sure you want to delete the job: <strong>{{ job.title }}</strong>?</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between">
                            <button type="submit" class="btn btn-danger"><i class="fas fa-trash me-2"></i>Yes, Delete</button>
                            <a href="{% url 'job_list' %}" class="btn btn-secondary"><i class="fas fa-arrow-left me-2"></i>Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
