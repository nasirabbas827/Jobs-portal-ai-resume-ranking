{% extends "base.html" %}
{% block title %}Register as Recruiter - Job Portal{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white d-flex align-items-center">
                    <i class="fas fa-user-tie me-2"></i>
                    <h2 class="card-title mb-0">Register as Recruiter</h2>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="{{ form.username.id_for_label }}" class="form-label"><i class="fas fa-user me-2"></i>Username</label>
                            {{ form.username }}
                        </div>
                        <div class="mb-3">
                            <label for="{{ form.email.id_for_label }}" class="form-label"><i class="fas fa-envelope me-2"></i>Email</label>
                            {{ form.email }}
                        </div>
                        <div class="mb-3">
                            <label for="{{ form.company_name.id_for_label }}" class="form-label"><i class="fas fa-building me-2"></i>Company Name</label>
                            {{ form.company_name }}
                        </div>
                        <div class="mb-3">
                            <label for="{{ form.password.id_for_label }}" class="form-label"><i class="fas fa-lock me-2"></i>Password</label>
                            {{ form.password }}
                        </div>
                        <button type="submit" class="btn btn-primary w-100"><i class="fas fa-user-tie me-2"></i>Register</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
