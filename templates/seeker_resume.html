{% extends "base.html" %}
{% block title %}Upload/Edit Resume - Job Portal{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white d-flex align-items-center">
                    <i class="fas fa-file-upload me-2"></i>
                    <h2 class="card-title mb-0">Upload / Edit Resume</h2>
                </div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="{{ form.file_path.id_for_label }}" class="form-label"><i class="fas fa-file-pdf me-2"></i>Resume File</label>
                            {{ form.file_path }}
                        </div>
                        <button type="submit" class="btn btn-primary w-100"><i class="fas fa-save me-2"></i>Save Resume</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
