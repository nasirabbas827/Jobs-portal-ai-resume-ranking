{% extends "base.html" %}
{% block title %}Update Company Profile - Job Portal{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white d-flex align-items-center">
                    <i class="fas fa-building me-2"></i>
                    <h2 class="card-title mb-0">Update Company Profile</h2>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="{{ form.name.id_for_label }}" class="form-label"><i class="fas fa-building me-2"></i>Company Name</label>
                            {{ form.name }}
                        </div>
                        <div class="mb-3">
                            <label for="{{ form.website.id_for_label }}" class="form-label"><i class="fas fa-globe me-2"></i>Website</label>
                            {{ form.website }}
                        </div>
                        <div class="mb-3">
                            <label for="{{ form.description.id_for_label }}" class="form-label"><i class="fas fa-file-alt me-2"></i>Description</label>
                            {{ form.description }}
                        </div>
                        <button type="submit" class="btn btn-primary w-100"><i class="fas fa-save me-2"></i>Save Company Profile</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
