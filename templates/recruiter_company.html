{% extends "base.html" %}
{% block title %}Update Company Profile - Job Portal{% endblock %}
{% block content %}

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            
            <div class="card-form p-4">
                
                <div class="text-center mb-4 pb-3 border-bottom">
                    <h2 class="fw-bold mb-1" style="color: var(--primary-color);">
                        <i class="bi bi-building-fill me-2"></i> Update Company Profile
                    </h2>
                    <p class="text-muted">Ensure your company details are up-to-date for potential candidates.</p>
                </div>
                
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="{{ form.name.id_for_label }}" class="form-label">
                            <i class="bi bi-building-fill me-2"></i>Company Name
                        </label>
                        {{ form.name }}
                    </div>
                    
                    <div class="mb-3">
                        <label for="{{ form.website.id_for_label }}" class="form-label">
                            <i class="bi bi-globe me-2"></i>Website
                        </label>
                        {{ form.website }}
                    </div>
                    
                    <div class="mb-4">
                        <label for="{{ form.description.id_for_label }}" class="form-label">
                            <i class="bi bi-file-earmark-text-fill me-2"></i>Company Description
                        </label>
                        {{ form.description }}
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 py-2">
                        <i class="bi bi-cloud-arrow-up-fill me-2"></i> Save Profile
                    </button>

                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
